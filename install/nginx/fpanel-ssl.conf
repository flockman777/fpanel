# Parameter TLS yang sama untuk semua vhost FPanel. ssl_stapling perlu
# untuk OCSP responder dari CA; dimatikan kalau cert-nya tidak punya staple.
ssl_protocols             TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache         shared:SSL:10m;
ssl_session_timeout       1d;
ssl_session_tickets       off;
