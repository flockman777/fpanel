# Host yang tidak terdaftar di FPanel harus DITOLAK, bukan dilayani
# oleh vhost lain. Tanpa ini, nginx memakai server block pertama pada
# port 80 sebagai default sehingga domain yang sudah dihapus /
# belonging to user lain ikut terlayani.
server {
    listen 80 default_server;
    server_name _;
    access_log off;
    return 444;
}
