[package]
name = "fserver"
version = "0.1.0"
edition = "2021"
description = "FPanel web server (Pingora) - serves client vhosts"

[dependencies]
pingora-core = "0.8"
pingora-proxy = "0.8"
pingora-http = "0.8"
async-trait = "0.1"
env_logger = "0.11"
log = "0.4"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
percent-encoding = "2"
regex = "1"
chrono = "0.4"

[profile.release]
opt-level = 3